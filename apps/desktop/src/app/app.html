<div class="app-shell">
  <header class="app-header">
    <a class="brand" routerLink="/welcome" aria-label="RepoLens home">
      <span class="brand-symbol" aria-hidden="true">R</span>
      <span class="brand-name">RepoLens</span>
    </a>

    <nav class="primary-navigation" aria-label="Main navigation">
      <a
        routerLink="/welcome"
        routerLinkActive="navigation-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Welcome</a
      >
      <a routerLink="/projects" routerLinkActive="navigation-active">Projects</a>
    </nav>

    <div class="header-context">
      @if (activeProject(); as current) {
        <div class="active-project" [title]="current.rootPath">
          <span class="active-project-label">CURRENT PROJECT</span>
          <span class="active-project-name">{{ current.name }}</span>
        </div>
      }
      <a class="settings-link" routerLink="/settings" routerLinkActive="navigation-active">
        <span aria-hidden="true">⚙</span><span>Settings</span>
      </a>
      <span class="app-version">v{{ appVersion() }}</span>
    </div>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
